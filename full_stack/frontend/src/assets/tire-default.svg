<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Dark background strip -->
  <rect width="200" height="80" fill="#1F2937"/>

  <!-- Outer tire circle -->
  <circle cx="100" cy="40" r="32" fill="#111827" stroke="#374151" stroke-width="2"/>
  <!-- Sidewall highlight ring -->
  <circle cx="100" cy="40" r="32" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Tread band (dark rubber) -->
  <circle cx="100" cy="40" r="30" fill="#1C1C1C"/>
  <!-- Tread grooves -->
  <circle cx="100" cy="40" r="28" fill="none" stroke="#374151" stroke-width="2.5"/>
  <circle cx="100" cy="40" r="24" fill="none" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Tread blocks: radial lines at intervals -->
  <g stroke="#374151" stroke-width="1.2">
    <line x1="100" y1="10" x2="100" y2="14"/>
    <line x1="100" y1="66" x2="100" y2="70"/>
    <line x1="70" y1="40" x2="66" y2="40"/>
    <line x1="130" y1="40" x2="134" y2="40"/>
    <!-- diagonal tread marks (45°) -->
    <line x1="79" y1="19" x2="82" y2="22"/>
    <line x1="118" y1="58" x2="121" y2="61"/>
    <line x1="121" y1="19" x2="118" y2="22"/>
    <line x1="79" y1="58" x2="82" y2="61"/>
  </g>

  <!-- Rim / hub -->
  <circle cx="100" cy="40" r="16" fill="#374151" stroke="#4B5563" stroke-width="1.5"/>
  <!-- Centre hub cap -->
  <circle cx="100" cy="40" r="8" fill="#4B5563" stroke="#6B7280" stroke-width="1"/>
  <!-- Lug-nut positions (5-stud) -->
  <g fill="#6B7280">
    <circle cx="100" cy="27" r="2"/>
    <circle cx="112" cy="34" r="2"/>
    <circle cx="107" cy="49" r="2"/>
    <circle cx="93"  cy="49" r="2"/>
    <circle cx="88"  cy="34" r="2"/>
  </g>
  <!-- Centre dot -->
  <circle cx="100" cy="40" r="3" fill="#9CA3AF"/>
</svg>
