server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + SSE → public gateway. Covers /api/v1/** and /api/ai/**.
    location /api/ {
        proxy_pass http://gateway-proxy:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (chat stream, /api/v1/events): no buffering, long timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
