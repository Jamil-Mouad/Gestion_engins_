spring:
  application:
    name: gateway-auth
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/fleettracker}
    username: ${POSTGRES_USER:intersig}
    password: ${POSTGRES_PASSWORD:CHANGE_ME}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: ${FLYWAY_LOCATIONS:filesystem:../../../db/migrations}
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-hours: ${JWT_REFRESH_TTL_HOURS:8}
  rate-limit:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    refill-seconds: ${RATE_LIMIT_REFILL_SECONDS:30}
  mail:
    from: ${MAIL_FROM:noreply@intersig.ma}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8086

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    baseline-on-migrate: true

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    baseline-on-migrate: true
