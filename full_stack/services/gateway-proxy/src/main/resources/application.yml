server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  cloud:
    gateway:
      filter:
        local-response-cache:
          enabled: false  # SCG 4.2.1 bug: LocalResponseCache post-processor crashes on committed response headers
      routes:
        - id: gateway-auth
          uri: ${GATEWAY_AUTH_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/auth/**

        # AI-Engine route — SSE streaming with circuit breaker
        - id: ai-engine-sse
          uri: ${AI_ENGINE_URI:http://localhost:8090}
          predicates:
            - Path=/api/ai/**
          filters:
            - RewritePath=/api/ai/(?<segment>.*), /ai/${segment}
            - AddResponseHeader=X-Accel-Buffering, no
            - CircuitBreaker=name=ai-engine-cb,fallbackUri=forward:/fallback/ai

        # SSE route — guard against global cache buffering the event stream
        - id: fleet-core-sse
          uri: ${FLEET_CORE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/events/**
          filters:
            - AddResponseHeader=Cache-Control, no-store

        # Magasin (gasoil) service — must stay above the fleet-core catch-all
        - id: magasin
          uri: ${MAGASIN_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/magasin/**

        # All other fleet-core routes
        - id: fleet-core
          uri: ${FLEET_CORE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/**

app:
  jwt:
    secret: ${JWT_SECRET:}

resilience4j:
  circuitbreaker:
    instances:
      ai-engine-cb:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
  timelimiter:
    instances:
      ai-engine-cb:
        timeout-duration: 120s
        cancel-running-future: false

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health}
