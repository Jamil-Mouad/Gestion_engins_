server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  cloud:
    gateway:
      filter:
        local-response-cache:
          enabled: false  # disabled globally; per-route filters control caching explicitly
      routes:
        - id: gateway-auth
          uri: ${GATEWAY_AUTH_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/auth/**

        # SSE route — guard against global cache buffering the event stream
        - id: fleet-core-sse
          uri: ${FLEET_CORE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/events/**
          filters:
            - AddResponseHeader=Cache-Control, no-store

        # Cacheable GET endpoints: vehicles, composants, KPIs, dashboard
        - id: fleet-core-cacheable
          uri: ${FLEET_CORE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/vehicules/**, /api/v1/composants/**, /api/v1/kpis/**, /api/v1/dashboard/**
            - Method=GET
          filters:
            - name: LocalResponseCache
              args:
                timeToLive: 30s
                size: 5MB

        # All other fleet-core routes (mutations, non-cacheable reads)
        - id: fleet-core
          uri: ${FLEET_CORE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/**

app:
  jwt:
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
