server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  cloud:
    gateway:
      filter:
        local-response-cache:
          enabled: false  # SCG 4.2.1 bug: LocalResponseCache post-processor crashes on committed response headers
      routes:
        - id: gateway-auth
          uri: ${GATEWAY_AUTH_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/auth/**

        # SSE route — guard against global cache buffering the event stream
        - id: fleet-core-sse
          uri: ${FLEET_CORE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/events/**
          filters:
            - AddResponseHeader=Cache-Control, no-store

        # All other fleet-core routes
        - id: fleet-core
          uri: ${FLEET_CORE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/**

app:
  jwt:
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
