services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleettracker
      POSTGRES_USER: ${POSTGRES_USER:-intersig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intersig} -d fleettracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-auth:
    build:
      context: ./services/gateway-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/fleettracker
      POSTGRES_USER: ${POSTGRES_USER:-intersig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_HOURS: ${JWT_REFRESH_TTL_HOURS:-8}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FLYWAY_LOCATIONS: filesystem:/db/migrations
    volumes:
      - ../db/migrations:/db/migrations:ro
    expose:
      - "8086"

  fleet-core:
    build:
      context: ./services/fleet-core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/fleettracker
      POSTGRES_USER: ${POSTGRES_USER:-intersig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    expose:
      - "8081"

  gateway-proxy:
    build:
      context: ./services/gateway-proxy
    restart: unless-stopped
    depends_on:
      - gateway-auth
      - fleet-core
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_AUTH_URI: http://gateway-auth:8086
      FLEET_CORE_URI: http://fleet-core:8081

volumes:
  db_data:
