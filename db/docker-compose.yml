services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: intersig_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-intersig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intersig_dev}
      POSTGRES_DB:       ${POSTGRES_DB:-fleettracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intersig} -d ${POSTGRES_DB:-fleettracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
